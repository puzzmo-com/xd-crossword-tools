name: NPM Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # Required for creating git tags
  id-token: write # This is required for npm provenance

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build parser
        run: yarn workspace xd-crossword-tools-parser build

      - name: Build lib
        run: yarn workspace xd-crossword-tools build

      - name: Type check
        run: yarn type-check

      - name: Run tests
        run: yarn test --run

      - name: Check if packages need publishing
        id: check-versions
        run: |
          set -e
          NEEDS_PUBLISH=""

          # Check xd-crossword-tools-parser
          PARSER_LOCAL=$(cd packages/xd-crossword-tools-parser && node -p "require('./package.json').version")
          # Look up this exact version, comparing against 'latest' would re-publish prereleases forever
          PARSER_PUBLISHED=$(npm view "xd-crossword-tools-parser@$PARSER_LOCAL" version 2>/dev/null || true)
          echo "Parser: Local=$PARSER_LOCAL, Published=${PARSER_PUBLISHED:-no}"

          if [ -z "$PARSER_PUBLISHED" ]; then
            echo "xd-crossword-tools-parser needs publishing: $PARSER_LOCAL"
            NEEDS_PUBLISH="$NEEDS_PUBLISH parser"
          fi

          # Check xd-crossword-tools
          TOOLS_LOCAL=$(cd packages/xd-crossword-tools && node -p "require('./package.json').version")
          # Look up this exact version, comparing against 'latest' would re-publish prereleases forever
          TOOLS_PUBLISHED=$(npm view "xd-crossword-tools@$TOOLS_LOCAL" version 2>/dev/null || true)
          echo "Tools: Local=$TOOLS_LOCAL, Published=${TOOLS_PUBLISHED:-no}"

          if [ -z "$TOOLS_PUBLISHED" ]; then
            echo "xd-crossword-tools needs publishing: $TOOLS_LOCAL"
            NEEDS_PUBLISH="$NEEDS_PUBLISH tools"
          fi

          # Prereleases (e.g. 15.0.0-beta.0) go to the 'next' dist-tag so 'latest' doesn't move
          if [[ "$PARSER_LOCAL" == *-* ]]; then
            echo "dist-tag=next" >> $GITHUB_OUTPUT
          else
            echo "dist-tag=latest" >> $GITHUB_OUTPUT
          fi

          if [ -n "$NEEDS_PUBLISH" ]; then
            echo "packages-to-publish=$NEEDS_PUBLISH" >> $GITHUB_OUTPUT
            echo "should-publish=true" >> $GITHUB_OUTPUT
          else
            echo "should-publish=false" >> $GITHUB_OUTPUT
            echo "No packages need publishing"
          fi

      - name: Publish xd-crossword-tools-parser
        if: steps.check-versions.outputs.should-publish == 'true' && contains(steps.check-versions.outputs.packages-to-publish, 'parser')
        working-directory: packages/xd-crossword-tools-parser
        run: |
          npm publish --provenance --access public --tag ${{ steps.check-versions.outputs.dist-tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish xd-crossword-tools
        if: steps.check-versions.outputs.should-publish == 'true' && contains(steps.check-versions.outputs.packages-to-publish, 'tools')
        working-directory: packages/xd-crossword-tools
        run: |
          # Convert workspace:* dependency to actual version number
          PARSER_VERSION=$(cd ../xd-crossword-tools-parser && node -p "require('./package.json').version")
          sed -i.bak "s/\"xd-crossword-tools-parser\": \"workspace:\*\"/\"xd-crossword-tools-parser\": \"^$PARSER_VERSION\"/" package.json
          npm publish --provenance --access public --tag ${{ steps.check-versions.outputs.dist-tag }}
          # Restore original package.json
          mv package.json.bak package.json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release tag
        if: steps.check-versions.outputs.should-publish == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
